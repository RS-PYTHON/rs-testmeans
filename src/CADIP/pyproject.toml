[project]
name = "cadip-server-mockup"
version = "0.1.0"
description = "CADIP server mockup."
requires-python = ">=3.11,<4"
dependencies = [
    "Flask>=2.3.0",
    "flask-httpauth>=4.8.1,<5.0.0",
    "Flask-Bcrypt>=1.0.1",
    "boto3>=1.28.85",
    "botocore>=1.31.85",
    "dotenv>=0.9.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.2.0,<2",
    "pytest-cov>=7.0.0,<8",
    "pytest-docker>=3.2.3,<4",
    "pytest-error-for-skips>=2.0.2,<3",
    "pytest-httpx>=0.36.2,<0.37",
    "pytest-mock>=3.15.1,<4",
]

[tool.uv]
package = false # not a python package, only an application

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
