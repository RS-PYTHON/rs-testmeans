[project]
name = "rs-python"
authors = []
dynamic = ["version"]

requires-python = ">=3.11,<4"

dependencies = [
    "Flask >= 2.3.0",
    "Flask-HTTPAuth >= 4.8.0",
    "Flask-Bcrypt >= 1.0.1",
    "boto3 >= 1.28.85",
    "botocore >= 1.31.85",
    "dotenv >= 0.9.9"
    ]


[tool.poetry]
name = "adgs-server-mockup"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<4"
flask-bcrypt = "^1.0.1"
flask-httpauth = "^4.8.0"
dotenv = "^0.9.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
