[project]
name = "rs-python"
authors = []
dynamic = ["version"]

requires-python = ">=3.11,<4"

dependencies = [
    "Flask >= 2.3.0",
    "flask-httpauth (>=4.8.1,<5.0.0)",
    "Flask-Bcrypt >= 1.0.1"
    ]


[tool.poetry]
name = "lta-server-mockup"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4"
flask-bcrypt = "^1.0.1"
flask-httpauth = "^4.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.2.0"
pytest-cov = "^7.0.0"
pytest-docker = "^3.2.3"
pytest-error-for-skips = "^2.0.2"
pytest-httpx = ">=0.36"
pytest-mock = "^3.15.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
