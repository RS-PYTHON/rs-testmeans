[project]
name = "rs-python"
authors = []
dynamic = ["version"]

requires-python = ">=3.11,<4"

dependencies = [
    "Flask >= 2.3.0",
    "Flask-HTTPAuth >= 4.8.0",
    "Flask-Bcrypt >= 1.0.1"
    ]


[tool.poetry]
name = "lta-server-mockup"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4"
flask-bcrypt = "^1.0.1"
flask-httpauth = "^4.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
