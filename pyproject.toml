[project]
name = "rs-python"
authors = []
dynamic = ["version"]

requires-python = ">=3.11,<4"

dependencies = [
    "Flask >= 2.3.0",
    "Flask-HTTPAuth >= 4.8.0",
    "Flask-Bcrypt >= 1.0.1",
    "boto3 >= 1.28.85",
    "botocore >= 1.31.85",
    "dotenv >= 0.9.9"
    ]

[project.optional-dependencies]
tests = [
    "pytest >= 7.4.3"
    ]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = ">=26.3.1"
ruff = "^0.1.3"
mypy = "^1.6.1"
pre-commit = "^3.5.0"
bandit = "^1.8.3"
safety = "^3.5.2"
pylint = "^3.3.4"
flake8 = "^7.1.1"

[tool.ruff.lint.extend-per-file-ignores]
# init should be empty, doesn't need any docstrings
"__init__.py" = ["D104"]

[tool.poetry]
name = "rs-testmeans"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "src" },
    { include = "tests", format = "sdist" },
]

[tool.poetry.dependencies]
python = ">=3.11,<4"
flask-bcrypt = "^1.0.1"
flask-httpauth = "^4.8.0"
requests = "^2.31.0"
botocore = "^1.31.83"
boto3 = "^1.28.81"
tqdm = "^4.66.1"
moto = "^5.0.1"
flask-cors = "^4.0.0"
cffi = "^1.17.1"
flask = "^3.1.0"
dotenv = "^0.9.9"

[tool.poetry.group.dev]
optional = true


[tool.black]
line-length = 120

[tool.pytest.ini_options]
# This is mandatory for pytest-docker
# to have a pytest.rootdir set to project.rootdir


[tool.ruff]
line-length = 120 # is it useful if not using ruff formatter ?

[tool.ruff.lint]
# F = PyFlake
# E = pycodestyle
# I = isort
# N = pep8 naming
# D = pydocstyle
# PL = pylint
select = ["F", "E", "I", "N", "D", "PL"]
ignore = ["D203", "D213"]

[tool.mypy]
warn_redundant_casts = true
# Force analyze of partially annotate function signatures
check_untyped_defs = true
ignore_missing_imports = true

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203" # whitespace before ':'
]

[tool.pylint]
max-line-length = 120
disable = [
    "logging-fstring-interpolation",  # Logging f-string interpolation
    "R0917",  # Too many positional arguments
    "E0401", # import-error
    "R0902", # too-many-instance-attributes
    "R0913",  # too-many-arguments
    "too-many-locals",
    "not-context-manager",
    "too-many-lines",
    "too-many-public-methods",
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
